<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <button class="btn btn-primary" onclick="toggleSidebar()">Toggle Sidebar</button>
  <div class="d-flex">
    <div class="offcanvas-lg offcanvas-start bg-dark text-white" id="sidebar" style="width: 260px; min-height: 100vh;">
      Sidebar content
    </div>
    <div class="flex-grow-1 p-3">
      Main content
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      bootstrap.Offcanvas.getOrCreateInstance(sidebar).toggle();
    }
  </script>
</body>
</html>
